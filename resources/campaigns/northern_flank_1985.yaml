---
name: Kola - Northern Flank 1985
theater: Kola
authors: RetLab (laydown forked from Starfire's Able Archer 83)
recommended_player_faction: NATO Northern Flank 1985
recommended_enemy_faction: USSR Northern Fleet 1985
description:
  <p>September 1985. The Soviet 6th Army has crossed the border at Kirkenes and
  come down the only road there is. Finnmark is gone. Kirkenes, Banak and Alta
  are Soviet airfields now, and the spearhead is closing on the Lyngen position,
  the narrow neck of fjord and mountain where Norway always planned to stand.
  Behind it are Bardufoss, Evenes and the port of Narvik.</p>
  <p>Sweden and Finland are not in this war and intend to stay out of it. Both
  have live missile batteries on their borders and both will warn you once. The
  short way round the front is through their airspace, and it is closed to
  everyone.</p>
  <p>So the war is fought on one road and on the sea beside it. You fly from the
  four Norwegian fields NATO still holds and from a carrier in the Norwegian Sea.
  The Northern Fleet has come out of Murmansk, its supply ships are running to
  Kirkenes and round the North Cape to Banak, and the Backfires at Olenya are
  looking for your boat.</p>
  <p>Hold the Lyngen line, break the road behind it, and take Finnmark back.</p>
  <p>Stock DCS units only. Laydown built by RetLab from Starfire's <i>Able Archer
  83</i>, which still ships unchanged.</p>
miz: northern_flank_1985.miz
performance: 1
recommended_start_date: 1985-09-10
version: "10.9"
advanced_iads: true
# The Lyngen position. The front sits at strength x route length from the blue
# base, and the Bardufoss -> Alta road is about 140 NM, so 0.3 starts the fight
# near Skibotn instead of half-way to Alta.
control_point_strengths:
  Bardufoss: 0.3
settings:
  squadron_start_full: true
  # 1985: the Lot 20 Hornet, the Block 50 Viper and the Apache stand in for the
  # F/A-18A, the F-16A and the AH-64A, with weapons and cockpit kit held to the date.
  restrict_weapons_by_date: true
  restrict_props_by_date: true
  # §98: Sweden and Finland hold no airfield, so both read as uninvolved and
  # stand border SAMs. The plugin is on by default; the setting is not.
  neutral_border_defense: true
  # §81: the sea fight is the campaign. Finite anti-ship stock, staggered release.
  naval_magazines: true
  naval_weapon_release_stagger: true
  # §1: Bodo's Eagles hold an alert pair; each red fighter squadron holds four.
  # Six per squadron halves red's raids and thins its patrols as well.
  ownfor_default_qra_reserve: 2
  opfor_default_qra_reserve: 4
  # §52: three C2 cells are authored (Severomorsk, Olenya, Banak).
  c2_decapitation_effects: true
  # The carrier is 390 NM from Severomorsk and Andoya 385 NM from Olenya. The gate
  # is a cap on each airframe's own range, so this opens the deep targets to the
  # bombers without sending an F-5 there.
  max_mission_range_planes: 400
  # A base is patrolled only when an enemy field is inside this range. The nearest
  # opposed pair, Alta and Bardufoss, is 116 NM apart, so the stock 100 NM planned
  # no land-base patrol for either side. 300 covers every forward field.
  airbase_threat_range: 300
  plugins:
    skynetiads: true
    neutralborder: true
    navalmagazines: true
# The forward fields the Soviets captured get mobile batteries; the home fields
# keep fixed ones. Unpinned markers fill from the faction by band.
ground_forces:
  NF-Alta-SA6: SA-6
  NF-Banak-SA6: SA-6
  NF-Kirkenes-SA3: SA-3/S-125
  NF-Koshka-SA3: SA-3/S-125
  NF-Monchegorsk-SA2: SA-2/S-75
  NF-Severomorsk-SA10: SA-10/S-300PS (Single Radar)
  NF-Olenya-SA5: SA-5/S-200 (Single Radar)
  # The two Barents groups are what they are named, not a draw from the roster.
  NF-Red-SAG: Northern Fleet Surface Group
  NF-Red-Landing-Group: Northern Fleet Landing Group
victory:
  description: "Hold the Lyngen line and take Finnmark back."
  win_when:
    - label: "Finnmark liberated"
      min_turn: 6
      capture_cps: [Alta, Banak, Kirkenes]
  lose_when:
    - label: "The Narvik gate is lost"
      lose_cps: [Evenes]
