date: 2026-10-10
title: Red holds more alert fighters on Kola - Northern Flank 1985
change: >-
  New games of this campaign hold four fighters on ground alert in each
  red fighter squadron, up from two: 20 alert fighters in all. They
  launch when you come near. Red still flies its patrols and most of its
  raids. In a campaign already running, set Settings > Air Doctrine >
  Default QRA reserve per OPFOR interceptor squadron to 4.
watch: >-
  Push toward a red field: more than one pair scrambles to meet you.
