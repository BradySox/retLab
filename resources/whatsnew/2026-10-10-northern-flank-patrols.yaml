date: 2026-10-10
title: Both sides fly patrols on Kola - Northern Flank 1985
change: >-
  New games of this campaign set the airbase threat range to 300 NM. Red
  now patrols over Alta, Banak, Kirkenes and Koshka Yavr, and blue over
  its four land bases as well as the carrier. Before, the fields were too
  far apart for the planner to count any of them as threatened, so
  neither side flew a land-base patrol. In a campaign already running,
  set Settings > Air Doctrine > Airbase threat range (NM) to 300.
watch: >-
  Red's packages include BARCAP flights over its forward fields, and its
  strikes still fly.
