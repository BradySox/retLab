date: 2026-10-09
title: An outside AI can plan red
change: >-
  Settings > Campaign Management > Outside AI plans red hands red's missions
  and buying to the AI on your AI connect link. Say "your turn" and it plans red's
  packages, TOTs and front stances, and spends red's budget. If it plans
  nothing, the game plans red's missions at Take Off.
watch: >-
  Red's packages on the map are the ones the AI said it planned, and they
  fly in the mission.
